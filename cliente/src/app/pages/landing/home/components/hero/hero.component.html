<section class="hero text-content-font relative flex items-center bg-cover bg-center bg-no-repeat overflow-hidden"
         aria-label="Banner principal">
 
  <div class="hero__overlay absolute inset-0"></div>
 
  <div class="hero__content container relative z-[1] w-full max-w-[680px] text-white">
 
    <p class="hero__eyebrow
              w-fit mb-[0.85rem]
              font-bold tracking-[0.08em] uppercase
              bg-black/30 rounded-full
              px-[0.7rem] py-[0.35rem]
              border">
      Bienvenido a Tambito+
    </p>
 
    <h1 class="text-title-font
               m-0 leading-[1.05] font-extrabold text-balance
               hero__title">
      Todo lo que buscas en un solo lugar
    </h1>
 
    <p class="hero__description mt-4 leading-[1.6] max-w-[56ch]">
      Descubre ofertas exclusivas, envios rapidos y productos seleccionados para ti.
    </p>
 
    <div class="flex flex-wrap gap-[0.8rem] mt-[1.6rem]">
 
      <a class="hero__btn hero__btn--primary
                inline-flex items-center justify-center
                min-h-[42px] py-3 px-5
                rounded-full font-bold no-underline
                transition-[transform,filter,background-color] duration-[250ms] ease-out
                hover:-translate-y-0.5 hover:brightness-[1.03]"
         href="/catalogo">
        Comprar ahora
      </a>
 
      <a class="hero__btn hero__btn--ghost
                inline-flex items-center justify-center
                min-h-[42px] py-3 px-5
                rounded-full font-bold no-underline
                bg-white/[0.12] border border-white/30
                transition-[transform,filter,background-color] duration-[250ms] ease-out
                hover:-translate-y-0.5 hover:brightness-[1.03]"
         href="/ofertas">
        Ver ofertas
      </a>
 
    </div>
  </div>
</section>
