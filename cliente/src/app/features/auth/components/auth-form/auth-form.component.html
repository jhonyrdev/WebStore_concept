@if (isOpen()) {
  <div
    class="fixed inset-0 z-[1200] bg-black/50 flex items-center justify-center p-4"
    (click)="onClose()"
  >
    <div class="relative w-full max-w-sm mx-auto md:max-w-md" (click)="$event.stopPropagation()">
      <div
        class="w-full rounded-2xl bg-white border border-slate-200 py-8 px-7 md:py-10 md:px-8 backdrop-blur-xl shadow-[0_24px_48px_rgba(15,23,42,0.18)] overflow-hidden"
      >
        @if (!isRegister) {
          <app-login-form (switchToRegister)="toggleForm()" />
        } @else {
          <app-register-form (switchToLogin)="toggleForm()" />
        }
      </div>
    </div>
  </div>
}
