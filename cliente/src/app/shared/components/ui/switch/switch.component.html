<div
  class="flex items-center gap-2 select-none"
  [class.cursor-pointer]="!disabled"
  [class.cursor-not-allowed]="disabled"
  [class.opacity-60]="disabled"
  (click)="toggle()"
>
  <div
    class="relative w-11 h-6 transition-colors duration-200 ease-in-out rounded-full"
    [ngClass]="checked ? 'bg-[#ff0037]' : 'bg-gray-400'"
  >
    <div
      class="absolute top-1 left-1 w-4 h-4 transition-transform duration-200 ease-in-out transform bg-white rounded-full shadow-sm"
      [ngClass]="checked ? 'translate-x-5' : 'translate-x-0'"
    ></div>
  </div>
  @if (label) {
    <span class="text-sm font-medium text-[var(--text-general)]">{{ label }}</span>
  }
</div>
