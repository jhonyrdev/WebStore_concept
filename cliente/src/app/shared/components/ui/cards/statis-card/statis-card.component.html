<div class="statis-card" [style.background]="getBgStyle()">
  <div class="statis-card__overlay"></div>
  <div class="statis-card__content">
    <div class="statis-card__head">
      <div class="statis-card__icon" aria-hidden="true">
        <i [class]="iconClass"></i>
      </div>
      <div class="statis-card__title">{{ title }}</div>
    </div>

    <div class="statis-card__body">
      <div class="statis-card__value">{{ value }}</div>
      <div class="statis-card__subtitle" *ngIf="subtitle">{{ subtitle }}</div>
    </div>
  </div>
</div>
