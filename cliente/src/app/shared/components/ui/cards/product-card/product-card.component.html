<div [ngClass]="variant === 'slider' 
  ? 'snap-start shrink-0 w-full' 
  : 'h-full'"
  class="rounded-2xl overflow-hidden bg-white border border-gray-100 shadow-sm flex flex-col cursor-pointer"
  (click)="openDetail()">

  <div class="w-full h-44 bg-gray-100 overflow-hidden">
    @if (product.imagen) {
      <img [src]="product.imagen" [alt]="product.nombre"
           class="w-full h-full object-cover"/>
    } @else {
      <div class="w-full h-full flex items-center justify-center">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="8" fill="#E5E7EB"/>
          <path d="M10 28l8-8 4 4 4-6 8 10H10z" fill="#9CA3AF"/>
          <circle cx="15" cy="16" r="3" fill="#9CA3AF"/>
        </svg>
      </div>
    }
  </div>

  <div class="flex flex-col gap-1 p-3 flex-1">
    <p class="font-title font-semibold text-gray-900 leading-tight line-clamp-2">
      {{ product.nombre }}
    </p>
    <p class="font-precio font-regular text-gray-900 mt-1">
      {{ formattedPrice }}
    </p>
  </div>

  <div class="px-3 pb-3">
    <button (click)="onAddButtonClick($event)"
      class="w-full py-3 rounded-xl font-btn transition-all duration-150 active:scale-95
             bg-transparent text-[#a00691] border border-[#a00691] hover:bg-[#a00691] hover:text-white">
      Agregar
    </button>
  </div>

</div>

@if (selectedProduct()) {
  <app-detail-product
    [productData]="selectedProduct()"
    [currency]="currency"
    (closed)="closeDetail()"
    (cartAdded)="onDetailCartAdded($event)"
  ></app-detail-product>
}
