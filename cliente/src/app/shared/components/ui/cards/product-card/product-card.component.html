<div class="snap-start shrink-0 w-44 rounded-2xl overflow-hidden bg-white
            border border-gray-100 shadow-sm flex flex-col">

  <!-- Imagen -->
  <div class="w-full h-44 bg-gray-100 overflow-hidden">
    @if (product.imagen) {
      <img [src]="product.imagen" [alt]="product.nombre"
           class="w-full h-full object-cover"/>
    } @else {
      <div class="w-full h-full flex items-center justify-center">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="8" fill="#E5E7EB"/>
          <path d="M10 28l8-8 4 4 4-6 8 10H10z" fill="#9CA3AF"/>
          <circle cx="15" cy="16" r="3" fill="#9CA3AF"/>
        </svg>
      </div>
    }
  </div>

  <!-- Info -->
  <div class="flex flex-col gap-1 px-3 pt-3 pb-2 flex-1">
    <p class="text-sm font-semibold text-gray-900 leading-tight line-clamp-2">
      {{ product.nombre }}
    </p>
    <p class="text-base font-bold text-gray-900 mt-1">
      S/ {{ product.precio | number:'1.2-2' }}
    </p>
  </div>

  <!-- Botón -->
  <div class="px-3 pb-3">
    <button (click)="addToCart.emit(product)"
      [disabled]="product.stock === 0"
      class="w-full py-2 rounded-xl text-xs font-medium transition-all duration-150 active:scale-95"
      [ngClass]="product.stock > 0
        ? 'bg-black text-white hover:bg-gray-800'
        : 'bg-gray-200 text-gray-400 cursor-not-allowed'">
      {{ product.stock > 0 ? 'Agregar' : 'Agotado' }}
    </button>
  </div>

</div>
