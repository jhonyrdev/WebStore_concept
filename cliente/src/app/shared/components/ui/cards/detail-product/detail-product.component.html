@if (visible()) {
  <!-- Backdrop -->
  <div
    class="fixed inset-0 z-[1500] bg-black/50 backdrop-blur-sm transition-opacity duration-300"
    (click)="close()"
    aria-hidden="true"
  ></div>

  <!-- Modal -->
  <div
    class="fixed inset-0 z-[1600] flex items-center justify-center p-3 sm:p-4 overflow-y-auto"
    (click)="close()"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="product()?.nombre"
  >
    <div
      class="relative w-full max-w-lg md:max-w-3xl max-h-[88vh] bg-white rounded-2xl overflow-y-auto shadow-2xl animate-[fadeScale_0.25s_ease-out]"
      (click)="$event.stopPropagation()"
    >
      <!-- Close Button -->
      <button
        (click)="close()"
        class="absolute top-4 right-4 z-10 w-9 h-9 flex items-center justify-center rounded-full bg-white/90 border border-neutral-200 text-neutral-500 hover:bg-neutral-100 hover:text-neutral-800 transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:ring-offset-1"
        aria-label="Cerrar"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>

      <div class="grid grid-cols-1 md:grid-cols-2">
        <!-- Image -->
        <div class="relative bg-neutral-100 h-52 sm:h-60 md:h-auto md:min-h-[420px]">
          @if (product()?.imagen) {
            <img
              [src]="product()!.imagen"
              [alt]="product()?.nombre ?? 'Producto'"
              class="absolute inset-0 w-full h-full object-cover"
            />
          } @else {
            <div class="absolute inset-0 flex items-center justify-center bg-neutral-200">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-16 h-16 text-neutral-400"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <circle cx="8.5" cy="8.5" r="1.5" />
                <path d="m21 15-5-5L5 21" />
              </svg>
            </div>
          }
        </div>

        <!-- Content -->
        <div class="flex flex-col p-5 sm:p-6 md:p-8 gap-5 sm:gap-6">
          <!-- Header -->
          <div>
            <h2 class="font-semibold text-[#1a3a2e] text-2xl leading-tight mb-2">
              {{ product()?.nombre }}
            </h2>
            <p class="text-xl text-neutral-800 font-medium">
              {{ formattedPrice() }}
            </p>
          </div>

          <!-- Description -->
          <p class="text-neutral-600 text-sm leading-relaxed">
            Producto seleccionado. Puedes ajustar la cantidad antes de agregar al carrito.
          </p>

          <!-- Divider -->
          <hr class="border-neutral-100" />

          <!-- Quantity -->
          <div class="flex flex-col gap-3">
            <span class="text-xs font-semibold tracking-widest text-neutral-500 uppercase">
              Cantidad
            </span>
            <div class="flex items-center gap-4">
              <div class="flex items-center border border-neutral-300 rounded-lg overflow-hidden">
                <button
                  (click)="decrement()"
                  [disabled]="quantity() <= 1"
                  class="w-11 h-11 flex items-center justify-center text-xl text-neutral-700 hover:bg-neutral-100 active:bg-neutral-200 transition-colors duration-100 disabled:text-neutral-300 disabled:cursor-not-allowed focus:outline-none"
                  aria-label="Disminuir cantidad"
                >
                  <span class="leading-none select-none">−</span>
                </button>
                <span class="w-12 text-center text-base font-medium text-neutral-800 select-none">
                  {{ quantity() }}
                </span>
                <button
                  (click)="increment()"
                  [disabled]="quantity() >= (product()?.stock ?? 99)"
                  class="w-11 h-11 flex items-center justify-center text-xl text-neutral-700 hover:bg-neutral-100 active:bg-neutral-200 transition-colors duration-100 disabled:text-neutral-300 disabled:cursor-not-allowed focus:outline-none"
                  aria-label="Aumentar cantidad"
                >
                  <span class="leading-none select-none">+</span>
                </button>
              </div>
            </div>
          </div>

          <!-- CTA -->
          <button
            (click)="addToCart()"
            class="mt-auto w-full py-4 px-6 rounded-xl bg-[#1a3a2e] text-white font-semibold text-sm tracking-wide hover:bg-[#14302500] hover:bg-[#14302580] hover:bg-[#0f2820] active:scale-[0.98] transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:ring-offset-2"
            style="background-color: #1a3a2e"
            onmouseover="this.style.backgroundColor = '#0f2820'"
            onmouseout="this.style.backgroundColor = '#1a3a2e'"
          >
            Agregar al carrito
          </button>
        </div>
      </div>
    </div>
  </div>
}
