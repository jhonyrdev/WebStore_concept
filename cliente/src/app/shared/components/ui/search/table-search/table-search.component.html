<div class="relative w-full flex items-center">

  <span class="absolute left-3 text-[var(--color-gray)] pointer-events-none transition-colors duration-150"
    aria-hidden="true"
  >
    <i class="fa-solid fa-magnifying-glass text-sm"></i>
  </span>

  <input
    type="text"
    [placeholder]="placeholder()"
    [value]="query()"
    (input)="query.set($any($event.target).value)"
    class="pl-9 pr-9 h-10 w-full rounded-xl border-b border-gray-400 dark:border-gray-400 bg-transparent text-sm text-[var(--color-gray)] placeholder-gray-400 outline-none"
    aria-label="Buscar en la tabla"
    autocomplete="off"
    spellcheck="false"
  />

  @if (query()) {
    <button
      type="button"
      (click)="clear()"
      class="absolute right-2.5 flex items-center justify-center w-2 h-2 cursor-pointer"
      aria-label="Limpiar búsqueda"
    >
      <i class="fa-solid fa-xmark text-xs text-[var(--color-gray)]"></i>
    </button>
  }

</div>
