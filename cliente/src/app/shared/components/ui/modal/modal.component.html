@if (isOpen()) {
  <div
    class="fixed inset-0 bg-black/50 z-[1200] flex items-start justify-center px-4 animate-[backdropFade_0.2s_ease]"
    [class]="paddingTop()"
    (click)="closed.emit()"
  >
    <div
      class="bg-white w-full rounded-2xl shadow-2xl overflow-hidden animate-[dropdownFade_0.2s_ease]"
      [class]="maxWidth()"
      (click)="$event.stopPropagation()"
    >
      <ng-content />
    </div>
  </div>
}
