<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">
  <div class="w-full max-w-md rounded-2xl bg-white shadow-xl">
    <div class="flex items-center justify-between border-b px-6 py-4">
      <h2 class="text-xl font-semibold text-gray-800">
        {{ isEditMode ? 'Editar ' + title : 'Registrar ' + title }}
      </h2>
      <button type="button" (click)="onClose()" class="text-gray-500 transition hover:text-red-500">
        ✕
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-5 p-6">
      <ng-content />

      <div class="flex justify-end">
        <button
          type="submit"
          class="rounded-lg bg-blue-600 px-5 py-2 font-medium text-white transition hover:bg-blue-700"
        >
          {{ submitLabel }}
        </button>
      </div>
    </form>
  </div>
</div>
