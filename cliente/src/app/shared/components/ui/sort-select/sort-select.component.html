<div class="flex items-center gap-2 text-sm">
  @if (label()) {
    <span class="text-[var(--text-sub-form)]">{{ label() }}</span>
  }
  <select
    [value]="value()"
    [class.w-full]="fullWidth()"
    (change)="value.set($any($event.target).value)"
    class="border border-gray-200 rounded-lg px-3 py-1.5 bg-white
           focus:outline-none focus:border-red-500 cursor-pointer text-sm"
  >
    @for (opt of options(); track opt.value) {
      <option [value]="opt.value">{{ opt.label }}</option>
    }
  </select>
</div>
