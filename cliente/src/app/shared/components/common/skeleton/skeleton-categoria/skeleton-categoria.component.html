<section class="py-10">
  <div class="flex gap-4 px-4
              overflow-x-auto
              lg:grid lg:grid-cols-8 lg:gap-6 lg:px-8 container mx-auto">

    @for (item of items; track $index) {
      <div class="flex flex-col items-center gap-2
                  flex-shrink-0
                  w-[calc(50%-8px)]
                  sm:w-[calc(33.333%-11px)]
                  md:w-[calc(25%-12px)]
                  lg:w-auto">
        <div class="w-[72px] h-[72px] rounded-full bg-gray-200 animate-pulse"></div>
        <div class="h-3 w-16 bg-gray-200 rounded animate-pulse"></div>
        <div class="h-3 w-12 bg-gray-200 rounded animate-pulse"></div>
      </div>
    }

  </div>
</section>
