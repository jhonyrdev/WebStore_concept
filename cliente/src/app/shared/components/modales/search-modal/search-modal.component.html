@if (isOpen()) {
  <!-- Backdrop -->
  <div
    class="fixed inset-0 bg-black/50 z-[1200] flex items-start justify-center pt-20 px-4 animate-[backdropFade_0.2s_ease]"
    (click)="onClose()"
  >
    <div
      class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden animate-[dropdownFade_0.2s_ease]"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center h-14 px-4 gap-3" role="search">
        <!-- Lupa -->
        <svg
          class="w-5 h-5 text-[#a00691] shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="M21 21l-4.35-4.35" />
        </svg>

        <input
          type="search"
          class="flex-1 border-none outline-none text-base text-[#303030] placeholder:text-[#747474] bg-transparent [&::-webkit-search-cancel-button]:appearance-none"
          placeholder="¿Qué estás buscando?"
          [(ngModel)]="query"
          autocomplete="off"
          autofocus
          aria-label="Buscar productos"
        />

        <!-- Cerrar -->
        <button type="button" class="p-1 text-[#a00691]" (click)="onClose()" aria-label="Cerrar">
          <svg
            class="w-5 h-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>
}
