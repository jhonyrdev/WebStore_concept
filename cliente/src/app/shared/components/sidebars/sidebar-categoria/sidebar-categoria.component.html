<!-- Mobile Menu Overlay -->
<div
  class="fixed top-0 left-0 w-[280px] h-full bg-[#fffbf0] z-1100 shadow-[4px_0_20px_rgba(0,0,0,0.15)] flex flex-col transition-transform duration-300 ease-in-out"
  [class]="{ '-translate-x-full': !isMenuOpen(), 'translate-x-0': isMenuOpen() }"
  id="mobile-menu"
>
  <div class="flex items-center justify-between bg-[#a00691] px-5 py-4">
    <span class="text-white font-bold text-base">Categorias</span>
    <button
      class="bg-transparent border-none cursor-pointer text-white p-1 flex items-center"
      (click)="onToggle()"   
      aria-label="Cerrar menú"
    >
      <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M18 6L6 18M6 6l12 12" />
      </svg>
    </button>
  </div>

  <nav class="flex flex-col py-2">
    @for (cat of categorias; track cat.href) {
      
        <a [href]="cat.href"
        class="block px-5 py-[0.85rem] text-[#4e4e4e] no-underline text-[0.95rem] font-medium  transition-colors hover:text-[#5e0956]"
      >{{ cat.label }}</a>
    }
  </nav>
</div>

<!-- Backdrop -->
@if (isMenuOpen()) {
  <div
    class="fixed inset-0 bg-black/45 z-1050 animate-[backdropFade_0.25s_ease]"
    (click)="onToggle()"  
  ></div>
}
