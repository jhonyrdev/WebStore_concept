<app-sidebar-shell title="Menú" [isOpen]="isOpen()" (toggle)="toggleMenu.emit()">
  <nav class="flex flex-col py-2">
    @for (link of links; track link.href) {
      <a [href]="link.href"
        class="block px-5 py-[0.85rem] text-[#4e4e4e] no-underline
               text-[0.95rem] font-medium transition-colors hover:text-[#5e0956]">
        {{ link.label }}
      </a>
    }
  </nav>
</app-sidebar-shell>
