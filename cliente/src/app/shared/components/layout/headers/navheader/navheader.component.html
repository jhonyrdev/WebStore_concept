<header class="bg-[#a00691]">
  <nav
    class="flex items-center h-14 text-title-font text-white sticky top-0 z-[1000] container gap-4 md:gap-4"
  >
    <!-- ══════════ MOBILE LAYOUT (< md) ══════════ -->
    <div class="flex md:hidden items-center gap-1 shrink-0">
      <button
        class="flex items-center bg-transparent border-none cursor-pointer p-1.5 rounded-md transition-colors hover:bg-white/10"
        (click)="toggleMobileMenu()"
        aria-label="Abrir menú"
      >
        <i class="fa-solid fa-bars font-icon" aria-hidden="true"></i>
      </button>

      <button
        class="flex items-center bg-transparent border-none cursor-pointer p-1.5 rounded-md transition-colors hover:bg-white/10"
        (click)="toggleSearch()"
        aria-label="Buscar"
      >
        <i class="fa-solid fa-magnifying-glass font-icon" aria-hidden="true"></i>
      </button>
    </div>
    <div class="flex md:hidden flex-1 justify-center">
      <a href="/" class="no-underline leading-none" aria-label="Inicio">
        <img src="assets/img/logo/logoMobileSecundario.webp" alt="Tambito+" class="h-8 w-auto" />
      </a>
    </div>
    <div class="flex md:hidden items-center shrink-0">
      <app-cart variant="mobile" />
    </div>

    <!-- ══════════ DESKTOP LAYOUT (md+) ══════════ -->
    <div class="hidden md:flex items-center gap-3 shrink-0">
      <a href="/" class="no-underline leading-none tracking-tight" aria-label="Inicio">
        <img src="assets/img/logo/logoAlternativo.webp" alt="Tambito+" class="h-8 w-auto" />
      </a>

      <button
        class="flex items-center gap-1.5 bg-transparent border-none cursor-pointer px-2.5 py-1.5 rounded-md text-[0.8rem] font-semibold tracking-wide transition-colors hover:bg-white/10"
        (click)="toggleMenu()"
        aria-label="Abrir categorías"
      >
        <i class="fa-solid fa-bars text-[1.1rem] shrink-0" aria-hidden="true"></i>
        <span>Categorias</span>
      </button>
    </div>
    <div class="hidden md:flex flex-1 max-w-[680px] mx-auto">
      <div
        class="flex items-center bg-white rounded-full overflow-hidden h-9 w-full shadow-sm focus-within:ring-2 focus-within:ring-[#f2c32f] transition-shadow"
        role="search"
      >
        <input
          type="search"
          class="flex-1 border-none outline-none px-4 text-sm text-[#303030] bg-transparent h-full placeholder:text-[#747474] [&::-webkit-search-cancel-button]:appearance-none"
          placeholder="¿Qué estás buscando?"
          [ngModel]="searchService.queryDesktop()"
          (ngModelChange)="searchService.queryDesktop.set($event)"
          autocomplete="off"
          aria-label="Buscar productos"
        />
      </div>
      <app-search-resultado modo="desktop" />
    </div>

    <div class="hidden md:flex items-center gap-1 shrink-0">
      <div
        class="flex items-center gap-1.5 cursor-pointer px-2.5 py-1.5 rounded-md transition-colors hover:bg-white/10 whitespace-nowrap relative select-none"
        id="nav-account"
        (click)="handleAccountClick()"
      >
        <i class="fa-regular fa-user text-[1.2rem]" aria-hidden="true"></i>
        <div class="flex items-center gap-[0.15rem]">
          <span class="text-[0.8rem] font-medium">
            @if (isLoggedIn()) {
              Mi cuenta
            } @else {
              Iniciar sesión
            }
          </span>
          <i
            class="fa-solid fa-chevron-down text-[0.7rem] transition-transform duration-200"
            [class.rotate-180]="isLoggedIn() && isAccountOpen()"
            aria-hidden="true"
          ></i>
        </div>

        @if (isAccountOpen()) {
          <div
            class="absolute top-[calc(100%+6px)] right-0 bg-white rounded-xl shadow-[0_8px_30px_rgba(0,0,0,0.15)] min-w-[180px] py-2 overflow-hidden animate-[dropdownFade_0.18s_ease]"
          >
            <a
              (click)="onLogout($event)"
              class="block px-[1.1rem] py-2.5 text-[#4e4e4e] no-underline text-[0.85rem] transition-colors hover:text-[#5e0956]"
            >
              Cerrar Sesión
            </a>
            <div class="h-px bg-[#fde68a] my-1"></div>
            <a
              href="/perfil"
              class="block px-[1.1rem] py-2.5 text-[#4e4e4e] no-underline text-[0.85rem] transition-colors hover:text-[#5e0956]"
            >
              Mi perfil
            </a>
            <a
              href="/pedidos"
              class="block px-[1.1rem] py-2.5 text-[#4e4e4e] no-underline text-[0.85rem] transition-colors hover:text-[#5e0956]"
            >
              Mis pedidos
            </a>
          </div>
        }
      </div>

      <app-cart variant="desktop" />
    </div>
  </nav>
</header>

<!-- Sidebar categorías — solo md+ -->
<div class="hidden md:block">
  <app-sidebar-categoria [isMenuOpen]="isMenuOpen()" (toggleMenu)="toggleMenu()" />
</div>

<!-- Sidebar mobile — solo < md -->
<div class="block md:hidden">
  <app-sidebar-mobile
    [isOpen]="isMobileMenuOpen()"
    [isLoggedIn]="isLoggedIn()"
    (toggleMenu)="toggleMobileMenu()"
    (joinClick)="openLoginFromMobile()"
  />
</div>

<!-- Modal de búsqueda mobile -->
<app-search-modal [isOpen]="isSearchOpen()" (closed)="toggleSearch()" />

@if (loginModalOpen()) {
  <app-auth-form [isOpen]="loginModalOpen()" (closed)="closeLoginModal()"></app-auth-form>
}
