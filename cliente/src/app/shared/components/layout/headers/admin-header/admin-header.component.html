<div class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between border-b px-4 py-4 border-[rgba(255,255,255,0.18)] bg-[var(--bg-secundario)]">
  
  <!-- Logo -->
  <span class="no-underline leading-none tracking-tight" aria-label="Inicio">
    <img src="assets/img/logo/logoAlternativo.webp" alt="Tambito+" class="h-8 w-auto" />
  </span>

  <!-- Usuario -->
  <div class="relative">
    <button
      type="button"
      class="flex items-center gap-3 rounded-md px-2 py-2 text-left transition-colors hover:bg-white/10"
      (click)="toggleProfileMenu()"
    >
      <i class="fas fa-user-circle text-2xl text-[var(--color-primary)]"></i>
    </button>

    @if (isProfileMenuOpen) {
      <div class="absolute top-full right-0 mt-2 w-48 rounded-xl border border-white/10 bg-[var(--color-primary-600)] p-2 shadow-2xl z-50">
        <button
          type="button"
          class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm transition-colors hover:bg-white/10"
          (click)="goToProfile()"
        >
          <i class="fas fa-id-card w-5 text-[var(--color-secondary-200)]"></i>
          <span>Perfil admin</span>
        </button>

        <button
          type="button"
          class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left text-sm transition-colors hover:bg-white/10"
          (click)="logout()"
        >
          <i class="fas fa-right-from-bracket w-5 text-[var(--color-secondary-200)]"></i>
          <span>Cerrar sesión</span>
        </button>
      </div>
    }
  </div>

</div>
