<div class="chart-card">
  <h2 class="chart-title">Productos Más Vendidos</h2>
  <div class="products-list">
    <div class="product-item" *ngFor="let product of topProducts">
      <div class="product-header">
        <span class="product-icon">{{ product.emoji }}</span>
        <span class="product-name">{{ product.name }}</span>
      </div>
      <div class="bar-container">
        <div class="bar" [style.width]="getBarWidth(product.sales)" [style.background-color]="product.color"></div>
      </div>
      <span class="product-value">{{ product.sales }} ventas</span>
    </div>
  </div>
</div>
