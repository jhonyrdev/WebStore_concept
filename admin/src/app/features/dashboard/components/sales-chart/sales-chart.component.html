<div class="chart-card">
  <h2 class="chart-title">Ventas Diarias</h2>
  <div class="chart-container">
    <svg viewBox="0 0 700 350" class="chart-svg">
      <!-- Grid lines -->
      <line x1="60" y1="30" x2="60" y2="300" stroke="#999" stroke-width="2" />
      <line x1="60" y1="300" x2="680" y2="300" stroke="#999" stroke-width="2" />

      <!-- Y-axis labels -->
      <text x="40" y="35" text-anchor="end" class="axis-label">1500</text>
      <text x="40" y="100" text-anchor="end" class="axis-label">1000</text>
      <text x="40" y="165" text-anchor="end" class="axis-label">500</text>
      <text x="40" y="305" text-anchor="end" class="axis-label">0</text>

      <!-- Bars -->
      <g *ngFor="let data of salesData; let i = index">
        <rect 
          [attr.x]="80 + i * 85" 
          [attr.y]="300 - (data.sales / maxSales * 270)"
          [attr.width]="60"
          [attr.height]="data.sales / maxSales * 270"
          fill="#8b2d7e"
          opacity="0.8"
        />
        <text 
          [attr.x]="110 + i * 85" 
          [attr.y]="320" 
          text-anchor="middle" 
          class="bar-label"
        >
          {{ data.day }}
        </text>
        <text 
          [attr.x]="110 + i * 85" 
          [attr.y]="295 - (data.sales / maxSales * 270)"
          text-anchor="middle" 
          class="bar-value"
        >
          {{ data.sales }}
        </text>
      </g>
    </svg>
  </div>
</div>
