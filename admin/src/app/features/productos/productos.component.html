<div class="productos-container">
  <div class="header">
    <h1>Productos</h1>
    <button class="btn-add" (click)="toggleForm()" [class.active]="showAddForm">
      {{ showAddForm ? '✕ Cancelar' : '+ Añadir producto' }}
    </button>
  </div>

  <div class="add-form" *ngIf="showAddForm">
    <div class="form-group">
      <input type="text" placeholder="Nombre del producto" [(ngModel)]="newProducto.nombre" class="form-input">
    </div>
    <div class="form-row">
      <div class="form-group">
        <select [(ngModel)]="newProducto.categoria" class="form-input">
          <option value="">Seleccionar categoría</option>
          <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
        </select>
      </div>
      <div class="form-group">
        <input type="number" placeholder="Precio" [(ngModel)]="newProducto.precio" class="form-input">
      </div>
      <div class="form-group">
        <input type="number" placeholder="Stock" [(ngModel)]="newProducto.stock" class="form-input">
      </div>
    </div>
    <button (click)="addProducto()" class="btn-save">Guardar Producto</button>
  </div>

  <div class="filters">
    <input 
      type="text" 
      placeholder="Buscar productos..." 
      [(ngModel)]="searchTerm"
      class="search-input"
    >
    <select [(ngModel)]="selectedCategory" class="filter-select">
      <option value="todos">Todos</option>
      <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
    </select>
  </div>

  <div class="table-wrapper">
    <table class="products-table">
      <thead>
        <tr>
          <th>Productos</th>
          <th>Categoría</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let producto of filteredProductos" [class.disabled]="producto.estado === 'Agotado'">
          <td>
            <span class="product-icon">◆</span>
            <span>{{ producto.nombre }}</span>
          </td>
          <td>{{ producto.categoria }}</td>
          <td>S/. {{ producto.precio.toFixed(2) }}</td>
          <td>{{ producto.stock }}</td>
          <td>
            <span class="badge" [ngClass]="producto.estado === 'Disponible' ? 'available' : 'out-of-stock'">
              {{ producto.estado }}
            </span>
          </td>
          <td class="actions">
            <button class="btn-icon edit" title="Editar">✎</button>
            <button class="btn-icon delete" (click)="deleteProducto(producto.id)" title="Eliminar">✕</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="pagination" *ngIf="filteredProductos.length > 0">
    <p>Mostrando <strong>{{ filteredProductos.length }}</strong> de <strong>{{ productos.length }}</strong> productos</p>
  </div>
</div>
