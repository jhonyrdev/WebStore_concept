server.port=${PORT:8081}

# === DATASOURCE ===
spring.datasource.url=${DB_HOST}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === HIKARI (POOL) ===
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=0
spring.datasource.hikari.auto-commit=false

# === JPA / HIBERNATE ===
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# === FLYWAY ===
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# === LOGGING ===
logging.level.org.flywaydb=INFO

# === SECURITY (JWT) ===
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# === GOOGLE OAUTH SERVICE ===
google.client-id=${CLIENT_ID}
google.client-secret=${CLIENT_SECRET}
google.redirect-uri=${GOOGLE_REDIRECT_URI}

# === RENIEC CONSULT SERVICE ===
api.peru.url1=${API_PERU_URL1}
api.peru.v1 = ${API_PERU_V1}
api.peru.url2 = ${API_PERU_URL2}
api.peru.v2 = ${API_PERU_V2}

dni.fallback.enabled=${FALLBACK_ENABLED:true}

# === EMAILSERVICE ===
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true



# === CLOUDINARY SERVICE ===
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}